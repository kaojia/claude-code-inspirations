name: Build site from recipes.json

# 改版說明：從「每天呼叫 API 生成靈感」轉為「策展式食譜庫」。
# 不再有排程、不再燒 API 費。改成 recipes.json / 模板 / build.py 有變動時，
# 自動重建 index.html 並提交。編輯內容 = 改 recipes.json 後 push。

on:
  push:
    paths:
      - 'recipes.json'
      - 'scripts/template.html'
      - 'scripts/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index.html
        run: python scripts/build.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: 從 recipes.json 重建 index.html"
            git push
          fi
