name: Weekly auto-add from What's New

# 每週檢查官方 What's New。偵測到新的一週彙整時，用 Claude API 依「當週真實內容」
# 起草食譜、通過驗證（連結可達的官方文件頁、欄位齊全、標題不重複）後，
# 自動寫入 recipes.json、重建 index.html 並推上線。
# 沒有新週報、或沒有任何一則通過驗證，就安靜結束、不改檔。

on:
  schedule:
    # 每週一 09:00 台灣時間 (UTC+8) = UTC 週一 01:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect new What's New week
        id: check
        run: python scripts/check_docs_updates.py

      - name: Draft recipes from this week's digest
        id: gen
        if: steps.check.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEEK_URL: ${{ steps.check.outputs.url }}
        run: python scripts/generate_from_whatsnew.py

      - name: Rebuild index.html
        if: steps.gen.outputs.added == 'true'
        run: python scripts/build.py

      - name: Commit and push
        # 只要偵測到新週報就提交（至少更新 .docs-watch 基準；若有新食譜一併提交）
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add recipes.json index.html .docs-watch/last_week.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 依官方週報 ${{ steps.check.outputs.week }} 更新食譜庫"
            git push
          fi
